name: hkhub_app
description: "HK Hub - cross-border commute, residency tools and business data."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.1
  shared_preferences: ^2.5.3
  # Contributor fix linked in Tencent/tdesign-flutter#943; pinned until a compatible release.
  tdesign_flutter:
    git:
      url: https://github.com/runoob-coder/tdesign-flutter.git
      ref: 26865fd5c2195c7fbad0afc851a0238815f745a7
      path: tdesign-component
  url_launcher: ^6.3.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
